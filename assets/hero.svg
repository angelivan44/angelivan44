<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Ángel Iván Huayas Izquierdo — Senior FullStack Developer</title>
  <desc id="d">Banner animado con red neuronal de fondo, nombre con degradado en movimiento, línea de terminal escribiéndose y un núcleo orbital.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .fade{opacity:0;animation:fade .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}.d5{animation-delay:1.35s}
    @keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .float{animation:float 9s ease-in-out infinite}
    .float2{animation:float 13s ease-in-out infinite reverse}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-30px)}}
    .tw{animation:tw 3.2s ease-in-out infinite}
    .tw.b{animation-delay:1.1s}.tw.c{animation-delay:2.2s}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(-80px)}to{transform:translateY(420px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade{opacity:1}}
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#111629"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="640" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset=".5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#D97757"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;560 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#7a5af8" stop-opacity=".45"/><stop offset="1" stop-color="#7a5af8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#D97757" stop-opacity=".32"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#bb9af7"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bb9af7" stop-opacity=".07"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="typing">
      <rect x="80" y="292" height="34" width="0">
        <animate attributeName="width" values="0;0;540;540" keyTimes="0;.18;.6;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="float" cx="260" cy="90" r="260" fill="url(#blobA)"/>
    <circle class="float2" cx="1000" cy="320" r="240" fill="url(#blobB)"/>
    <rect class="scan" x="0" y="0" width="1200" height="80" fill="url(#scanG)"/>

    <!-- red de fondo -->
    <g fill="none" stroke="#7aa2f7" stroke-opacity=".22" stroke-width="1">
      <path d="M720 40 L820 95 L780 170 M820 95 L900 60 M640 330 L740 290 L780 350 M1110 60 L1150 140 L1090 210"/>
    </g>
    <g fill="#bb9af7">
      <circle class="tw" cx="720" cy="40" r="2.5"/><circle class="tw b" cx="820" cy="95" r="3"/>
      <circle class="tw c" cx="780" cy="170" r="2"/><circle class="tw" cx="900" cy="60" r="2.5"/>
      <circle class="tw b" cx="640" cy="330" r="2"/><circle class="tw c" cx="740" cy="290" r="3"/>
      <circle class="tw" cx="780" cy="350" r="2"/><circle class="tw b" cx="1110" cy="60" r="2.5"/>
      <circle class="tw c" cx="1150" cy="140" r="2"/><circle class="tw" cx="1090" cy="210" r="2.5"/>
    </g>

    <!-- texto -->
    <text class="mono fade d1" x="80" y="92" font-size="15" letter-spacing="3" fill="#7aa2f7">// HELLO WORLD, I'M</text>
    <text class="sans fade d2" x="78" y="158" font-size="62" font-weight="800" fill="url(#name)">Ángel Iván</text>
    <text class="sans fade d3" x="78" y="224" font-size="62" font-weight="800" fill="url(#name)">Huayas Izquierdo</text>
    <text class="sans fade d4" x="80" y="266" font-size="17" font-weight="600" letter-spacing="4" fill="#c0caf5">SENIOR FULLSTACK DEVELOPER · AI ENGINEERING</text>

    <g class="fade d5">
      <g clip-path="url(#typing)">
        <text class="mono" x="80" y="316" font-size="19" fill="#9ece6a" textLength="520" lengthAdjust="spacingAndGlyphs">$ ship --idea "software + automatización + IA"</text>
      </g>
      <rect class="blink" x="84" y="299" width="11" height="22" fill="#bb9af7">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;522 0;522 0" keyTimes="0;.18;.6;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- núcleo orbital -->
    <g transform="translate(985 190)">
      <circle r="132" fill="none" stroke="#7aa2f7" stroke-opacity=".18" stroke-dasharray="2 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle r="104" fill="none" stroke="#bb9af7" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="120 40 20 40"/>
        <circle cx="104" cy="0" r="6" fill="#bb9af7"/>
        <circle cx="-104" cy="0" r="4" fill="#7aa2f7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse rx="78" ry="30" fill="none" stroke="#D97757" stroke-opacity=".55" stroke-width="1.5"/>
        <circle cx="78" cy="0" r="5" fill="#D97757"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse rx="30" ry="78" fill="none" stroke="#7aa2f7" stroke-opacity=".45" stroke-width="1.5"/>
        <circle cx="0" cy="-78" r="4.5" fill="#7aa2f7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      </g>
      <circle r="44" fill="url(#core)" opacity=".55">
        <animate attributeName="r" values="38;50;38" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="22" fill="#111629" stroke="#bb9af7" stroke-width="2"/>
      <text class="mono" y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#e0def4">AI</text>
    </g>

    <rect y="376" width="1200" height="4" fill="url(#line)"/>
    <rect width="1199" height="379" x=".5" y=".5" rx="18" fill="none" stroke="#bb9af7" stroke-opacity=".18"/>
  </g>
</svg>
